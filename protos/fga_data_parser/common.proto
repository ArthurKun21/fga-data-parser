syntax = "proto3";

package fga_data_parser;

option java_package = "io.github.fga.data.atlas.proto";

// Skill targeting parsed from Atlas skill functions and scripts.
enum SkillTarget {
  UNSPECIFIED    = 0;
  TargetOne      = 1;
  TargetAll      = 2;
  CommandNPType2 = 3;
  CommandNPType3 = 4;
  Choice2        = 5;
  Choice3        = 6;
  Transform      = 7;
  OrderChange    = 8;
}

// Wrapper for a list of strings, since protobuf has no repeated repeated.
message StringList {
  repeated string values = 1;
}

message ScriptButton {
  string title = 1;
  repeated string buttons = 2;
}

message TransformDetail {
  int32 ascension = 1;
  optional int32 target_ascension = 2;
}

message Skill {
  int32 id = 1;
  int32 num = 2;
  string name = 3;
  string detail = 4;
  string icon = 5;
  int32 cooldown = 6;
  repeated SkillTarget target = 7;
  ScriptButton script_buttons = 8;
  repeated StringList buttons = 9;
  TransformDetail transform = 10;
}
