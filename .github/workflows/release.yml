name: Release

on:
  workflow_dispatch:
  schedule:
    # 18:00 JST (UTC+9)
    - cron: "0 9 * * *"

permissions:
  contents: write

# Serialize runs so a manual and a scheduled run can't generate the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      DATA_FILES: |
        nice_mystic_code*.json
        nice_equip*.json
        nice_servant*.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out Chaldea data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chaldea-center/chaldea-data
          path: chaldea-data
          fetch-depth: 1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --locked
      - name: Generate protobuf code
        run: uv run python scripts/generate_proto.py

      - name: Generate release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          RELEASE_REPOSITORY: ArthurKun21/fga-data
        run: |
          tag="$(uv run python scripts/release_tag.py)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore raw data
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.DATA_FILES }}
          key: data-nice-v1-${{ github.run_id }}
          restore-keys: data-nice-v1-

      - name: Check data age
        id: age
        run: |
          fresh=false
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            if [ -n "$(find . -maxdepth 1 -name "$pattern" -mmin -480 -print -quit)" ]; then
              fresh=true
              break
            fi
          done <<< "$DATA_FILES"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"

      - name: Drop stale data
        if: steps.age.outputs.fresh != 'true'
        run: rm -f $DATA_FILES

      - name: Parse data
        run: uv run fga-data-parser

      - name: Translate names
        run: uv run fgo-translate

      - name: Save raw data
        if: steps.age.outputs.fresh != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.DATA_FILES }}
          key: data-nice-v1-${{ github.run_id }}

      - name: Upload readable json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: readable-json
          path: |
            servant_data.json
            mystic_code_data.json
            craft_essence_data.json
            fgo_translate.json

      - name: Upload protobuf files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-protobuf
          path: |
            servant_data.pb
            mystic_code_data.pb
            craft_essence_data.pb
            fgo_translate.pb


  data-update:
    needs: release
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      CHANGED: 'false'
    steps:
      - name: Checkout FGA Data repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ArthurKun21/fga-data
          token: ${{ secrets.UPLOAD_TOKEN }}

      - name: Download files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: readable-json
          path: .

      - name: Commit and push
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No data changes to commit, skipping release"
            exit 0
          fi
          git commit -m "$RELEASE_TAG"
          git push
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: Download Release Protobuf files
        if: env.CHANGED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-protobuf
          path: .

      - name: Create release
        if: env.CHANGED == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          token: ${{ secrets.UPLOAD_TOKEN }}
          repository: ArthurKun21/fga-data
          name: ${{ needs.release.outputs.tag }}
          body: |
            # FGA Parsed data

            New release Atlas parsed data for https://github.com/ArthurKun21/fga-preview-build/
          files: |
            servant_data.pb
            mystic_code_data.pb
            craft_essence_data.pb
            fgo_translate.pb
