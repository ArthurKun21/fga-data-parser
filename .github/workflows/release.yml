name: Release

on:
  workflow_dispatch:
  schedule:
    # 18:00 JST (UTC+9)
    - cron: "0 9 * * *"

permissions:
  contents: write

# Serialize runs so a manual and a scheduled run can't generate the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      DATA_FILES: |
        nice_mystic_code*.json
        nice_equip*.json
        nice_servant*.json
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check out Chaldea data
        uses: actions/checkout@v7.0.1
        with:
          repository: chaldea-center/chaldea-data
          path: chaldea-data
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Generate protobuf code
        run: uv run python scripts/generate_proto.py

      - name: Generate release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          RELEASE_REPOSITORY: ArthurKun21/fga-data
        run: |
          tag="$(uv run python scripts/release_tag.py)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Compute 8h bucket
        id: bucket
        run: echo "b=$(( $(date +%s) / 28800 ))" >> "$GITHUB_OUTPUT"

      - name: Cache raw data
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.DATA_FILES }}
          key: data-nice-v1-${{ steps.bucket.outputs.b }}

      - name: Parse data
        run: uv run fga-data-parser

      - name: Translate names
        run: uv run fgo-translate

      - name: Commit overwrite translations
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add overwrite_translations.json
          if git diff --cached --quiet; then
            echo "No overwrite translation changes to commit"
            exit 0
          fi
          git commit -m "chore: update overwrite translations"
          git push

      - name: Upload readable json
        uses: actions/upload-artifact@v7.0.2
        with:
          name: readable-json
          path: |
            servant_data.json
            mystic_code_data.json
            craft_essence_data.json
            fgo_translate.json

      - name: Upload protobuf files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-protobuf
          path: |
            servant_data.pb
            mystic_code_data.pb
            craft_essence_data.pb
            fgo_translate.pb


  data-update:
    needs: release
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      CHANGED: 'false'
    steps:
      - name: Checkout FGA Data repository
        uses: actions/checkout@v7.0.1
        with:
          repository: ArthurKun21/fga-data
          token: ${{ secrets.UPLOAD_TOKEN }}

      - name: Download files
        uses: actions/download-artifact@v8.0.2
        with:
          name: readable-json
          path: .

      - name: Commit and push
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No data changes to commit, skipping release"
            exit 0
          fi
          git commit -m "$RELEASE_TAG"
          git push
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: Download Release Protobuf files
        if: env.CHANGED == 'true'
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-protobuf
          path: .

      - name: Create release
        if: env.CHANGED == 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          token: ${{ secrets.UPLOAD_TOKEN }}
          repository: ArthurKun21/fga-data
          name: ${{ needs.release.outputs.tag }}
          body: |
            # FGA Parsed data

            New release Atlas parsed data for https://github.com/ArthurKun21/fga-preview-build/
          files: |
            servant_data.pb
            mystic_code_data.pb
            craft_essence_data.pb
            fgo_translate.pb
