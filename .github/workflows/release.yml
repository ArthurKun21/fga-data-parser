name: Release

on:
  workflow_dispatch:
  schedule:
    # 18:00 JST (UTC+9)
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check out Chaldea data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: chaldea-center/chaldea-data
          path: chaldea-data
          fetch-depth: 1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - run: uv sync --locked
      - name: Generate protobuf code
        run: uv run python scripts/generate_proto.py

      - name: Generate release tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(uv run python scripts/release_tag.py)" >> "$GITHUB_OUTPUT"

      - name: Parse data
        run: uv run fga-data-parser

      - name: Translate names
        run: uv run fgo-translate

      - name: Upload readable json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: readable-json
          path: |
            servant_data.json
            mystic_code_data.json
            craft_essence_data.json
            fgo_translate.json

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.UPLOAD_TOKEN }}
          repository: ArthurKun21/fga-data
          name: ${{ steps.tag.outputs.tag }}
          body: |
            # FGA Parsed data

            New release Atlas parsed data for https://github.com/ArthurKun21/fga-preview-build/
          files: |
            servant_data.pb
            mystic_code_data.pb
            craft_essence_data.pb
            fgo_translate.pb

  data-update:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout FGA Data repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ArthurKun21/fga-data

      - name: Download files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: readable-json
          path: .

      - name: Commit and push
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "$RELEASE_TAG"
          git push
