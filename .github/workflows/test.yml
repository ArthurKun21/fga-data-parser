name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - name: Generate protobuf code
        run: uv run python scripts/generate_proto.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
