[project]
name = "fga-data-parser"
version = "0.1.0"
description = "Converts raw Fate/Grand Order data from the Atlas Academy API into data files for FGA (Fate/Grand Automata)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "orjson>=3.10.15",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.3.0",
    "ruff>=0.9.6",
]

[project.scripts]
fga-data-parser = "fga_data_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fga_data_parser"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
